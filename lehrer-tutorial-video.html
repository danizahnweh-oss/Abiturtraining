const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const progressBar = document.getElementById('progressBar');
const timeElapsedEl = document.getElementById('timeElapsed');
const timeTotalEl = document.getElementById('timeTotal');
const slideCounterEl = document.getElementById('slideCounter');
const speedBtn = document.getElementById('speedBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const skipBtn = document.getElementById('skipBtn');

const totalDuration = SLIDES.reduce((s, sl) => s + sl.duration, 0);

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function calcElapsedFromSlide(slideIdx, slideTime) {
  let t = 0;
  for (let i = 0; i < slideIdx; i++) t += SLIDES[i].duration;
  return t + slideTime;
}

function updateUI() {
  elapsed = calcElapsedFromSlide(currentSlide, slideElapsed);
  progressFill.style.width = ((elapsed / totalDuration) * 100) + '%';
  timeElapsedEl.textContent = fmtTime(elapsed);
  timeTotalEl.textContent = fmtTime(totalDuration);
  slideCounterEl.textContent = (currentSlide + 1) + ' / ' + SLIDES.length;
  playBtn.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9654;';
}

function renderSlide(idx, direction) {
  // Entferne alte Slides
  const oldSlides = player.querySelectorAll('.slide');
  oldSlides.forEach(s => {
    if (s.dataset.idx != idx) {
      s.classList.remove('active');
      s.classList.add(direction === 'next' ? 'exit-left' : '');
      setTimeout(() => s.remove(), 600);
    }
  });

  // Erstelle neuen Slide
  const slideData = SLIDES[idx];
  const div = document.createElement('div');
  div.className = 'slide';
  div.dataset.idx = idx;
  div.innerHTML = '<div class="slide-inner">' + slideData.render() + '</div>';
  player.appendChild(div);

  // Aktivieren mit kleiner Verzögerung für Transition
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      div.classList.add('active');
    });
  });

  // Custom Animationen
  if (slideData.onEnter) {
    setTimeout(() => slideData.onEnter(), 100);
  }
}

function goToSlide(idx, direction) {
  if (idx < 0 || idx >= SLIDES.length) return;
  currentSlide = idx;
  slideElapsed = 0;
  renderSlide(idx, direction);
  updateUI();
}

function tick() {
  if (!isPlaying) return;
  slideElapsed += 0.1 * speed;
  if (slideElapsed >= SLIDES[currentSlide].duration) {
    if (currentSlide < SLIDES.length - 1) {
      goToSlide(currentSlide + 1, 'next');
    } else {
      isPlaying = false;
      updateUI();
      return;
    }
  }
  updateUI();
}

function togglePlay() {
  isPlaying = !isPlaying;
  if (isPlaying && currentSlide === SLIDES.length - 1 && slideElapsed >= SLIDES[currentSlide].duration) {
    goToSlide(0, 'next');
  }
  updateUI();
}

function cycleSpeed() {
  const speeds = [0.5, 1, 1.5, 2];
  const idx = speeds.indexOf(speed);
  speed = speeds[(idx + 1) % speeds.length];
  speedBtn.textContent = speed + 'x';
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

// Event Listeners
playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', () => goToSlide(currentSlide - 1, 'prev'));
nextBtn.addEventListener('click', () => goToSlide(currentSlide + 1, 'next'));
speedBtn.addEventListener('click', cycleSpeed);
fullscreenBtn.addEventListener('click', toggleFullscreen);
skipBtn.addEventListener('click', () => {
  isPlaying = false;
  updateUI();
  window.location.href = 'lehrer.html';
});

// Klick auf Progressbar
progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const targetTime = pct * totalDuration;
  let acc = 0;
  for (let i = 0; i < SLIDES.length; i++) {
    if (acc + SLIDES[i].duration > targetTime) {
      currentSlide = i;
      slideElapsed = targetTime - acc;
      renderSlide(i, 'next');
      updateUI();
      return;
    }
    acc += SLIDES[i].duration;
  }
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') goToSlide(currentSlide + 1, 'next');
  if (e.code === 'ArrowLeft') goToSlide(currentSlide - 1, 'prev');
  if (e.code === 'KeyF') toggleFullscreen();
});

// Touch swipe
let touchStartX = 0;
player.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
player.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    if (dx < 0) goToSlide(currentSlide + 1, 'next');
    else goToSlide(currentSlide - 1, 'prev');
  }
}, { passive: true });

// Init
goToSlide(0, 'next');
updateUI();
tickInterval = setInterval(tick, 100);
</script>
</body>
</html>
