# Nginx Konfiguration für myAbiFlow – Hetzner
# Kopieren nach: /etc/nginx/sites-available/myabiflow
# Aktivieren: ln -s /etc/nginx/sites-available/myabiflow /etc/nginx/sites-enabled/

# Rate Limiting Zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myabiflow.de www.myabiflow.de;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/myabiflow.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myabiflow.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Statische Dateien (HTML, CSS, JS, Bilder, Videos)
    root /var/www/myabiflow;
    index index.html;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Kompression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # ================================================================
    # API ROUTES → Node.js Backend (Port 3000)
    # ================================================================

    # Login Endpoint (strengeres Rate Limiting)
    location = /api/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Alle anderen API-Routen
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # Lange KI-Anfragen

        # Body-Größe (für Bilder)
        client_max_body_size 10m;
    }

    # ================================================================
    # GEMINI PROXY → WebSocket + REST (Port 3001)
    # ================================================================

    # Gemini Live API WebSocket (Direct Mode, vom @google/genai SDK)
    location /ws/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Access-Token $http_x_access_token;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Session-Management (REST)
    location /session/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;  # 1 Stunde für WebSocket
        proxy_send_timeout 3600s;
    }

    # Gemini REST Proxy
    location /v1beta/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # ================================================================
    # FLOWIE TUTOR → Port 3002
    # ================================================================

    location /tutor/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ================================================================
    # STATISCHE DATEIEN
    # ================================================================

    # Service Worker + shared.js dürfen NICHT langzeit-gecacht werden (VOR der generischen Regel!)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /shared.js {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Cache für Assets (CSS, JS, Fonts, Bilder)
    location ~* \.(css|js|woff2|png|jpg|jpeg|gif|ico|svg|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # manifest.json
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML-Dateien: Immer revalidieren, sonst sehen User Code-Updates erst nach Stunden
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA Fallback (Kolloquiumstrainer)
    location /abitur-kolloquium-trainer/ {
        try_files $uri $uri/ /abitur-kolloquium-trainer/dist/index.html;
    }

    # FOS-Seiten
    location /fos/ {
        try_files $uri $uri/ =404;
    }

    # Root: index.html Fallback
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ================================================================
    # HEALTH CHECKS
    # ================================================================

    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
    }
}

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name myabiflow.de www.myabiflow.de;
    return 301 https://myabiflow.de$request_uri;
}

# www → non-www Redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.myabiflow.de;

    ssl_certificate /etc/letsencrypt/live/myabiflow.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myabiflow.de/privkey.pem;

    return 301 https://myabiflow.de$request_uri;
}
